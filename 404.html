<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Photoedits — 页面不存在</title>
<style>
  body{margin:0;min-height:100vh;background:#0f1117;color:#e8ebf5;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;text-align:center;padding:24px}
  .box{max-width:520px}
  .code{font-size:96px;font-weight:800;line-height:1;background:linear-gradient(135deg,#7c7cf0,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:24px;margin:16px 0 8px}
  p{color:#9aa2b8;line-height:1.7}
  a{display:inline-block;margin-top:20px;background:#7c7cf0;color:#fff;padding:10px 22px;border-radius:9px;text-decoration:none;font-weight:600}
  small{display:block;color:#5d6478;margin-top:18px}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>你访问的地址没有对应的内容。Photoedits 只提供 API 与说明文档，<br>请在几秒后返回首页，或直接点击下方按钮。</p>
    <a href="/">返回首页</a>
    <small><span id="sec">3</span> 秒后自动跳转 · <span id="path"></span></small>
  </div>
<script>
  var target = '/';
  document.getElementById('path').textContent = location.pathname;
  var sec = 3;
  var timer = setInterval(function () {
    sec -= 1;
    document.getElementById('sec').textContent = sec > 0 ? sec : 0;
    if (sec <= 0) { clearInterval(timer); location.replace(target); }
  }, 1000);
</script>
</body>
</html>
